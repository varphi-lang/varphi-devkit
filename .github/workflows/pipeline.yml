name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate ANTLR Parser
        run: |
          curl -O https://www.antlr.org/download/antlr-4.13.2-complete.jar
          java -jar antlr-4.13.2-complete.jar -Dlanguage=Python3 grammar/Varphi.g4 -o src/varphi_devkit/parser/
          git add -f src/varphi_devkit/parser/

      - name: Force uv to recognize generated files
        run: |
          # Dynamically delete any line in .gitignore referencing the parser
          sed -i '/src\/varphi_devkit\/parser/d' .gitignore

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest

  build-and-publish:
    name: Build, Publish to PyPI & Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate ANTLR Parser
        run: |
          curl -O https://www.antlr.org/download/antlr-4.13.2-complete.jar
          java -jar antlr-4.13.2-complete.jar -Dlanguage=Python3 grammar/Varphi.g4 -o src/varphi_devkit/parser/
          git add -f src/varphi_devkit/parser/

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'b') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
          make_latest: ${{ !(contains(github.ref, 'b') || contains(github.ref, 'alpha') || contains(github.ref, 'rc')) }}